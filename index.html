<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- What this page may load. Scripts only from Chatbox itself (and Google sign-in for Sync), so text
       from a character card can never run as code. Connections stay open: AI providers are your choice. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src * data: blob:; media-src * data: blob:; font-src 'self' data:; connect-src * data: blob:; frame-src https://accounts.google.com https://datacat.run; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0A0A0A">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Your own roleplay chat app. Bring your own AI key.">
  <title>Chatbox</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Chatbox">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preload" href="fonts/archivo-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link href="fonts/archivo.css" rel="stylesheet">
  <link rel="stylesheet" href="styles/app.css">
</head>
<body>
  <main id="app" class="app"></main>
  <div id="overlay-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <noscript><p style="padding:24px;font-family:system-ui">Chatbox needs JavaScript to run.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
